name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  foundry:
    name: Foundry / Solidity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
          cache: true

      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git

      - name: Formatting
        run: forge fmt --check

      - name: Foundry lint
        run: forge lint

      - name: Build
        run: forge build --sizes

      - name: Unit, fuzz and invariant tests
        run: forge test -vvv

      - name: Coverage summary
        run: forge coverage --report summary

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std@v1.16.2 --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.7.0 --no-git
      - name: Install Slither
        run: pipx install slither-analyzer==0.11.6
      - name: Run Slither
        run: slither . --config-file slither.config.json
