[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"
cbor_metadata = false

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

[profile.ci]
# Declaring the parent table preserves default project paths on older Foundry releases.

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 512
depth = 128
fail_on_revert = true
